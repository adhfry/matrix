name: matrix
description: "SiLAKES MATRIX - Manajemen Absensi Terintegrasi dan Remunerasi Insentif eXpert"
publish_to: "none"
version: 2.1.0+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & jaringan
  flutter_riverpod: ^3.4.3
  dio: ^5.8.0

  # Penyimpanan aman (token, PIN)
  flutter_secure_storage: ^11.2.0

  # Absen wajah, lokasi, suara
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  geolocator: ^14.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.10.1
  permission_handler: ^13.0.2
  flutter_tts: ^4.2.3
  local_auth: ^3.0.2

  # Berkas & gambar (lampiran izin, foto KTP, slip PDF)
  file_picker: ^13.1.0
  image_picker: ^1.1.2
  image: ^4.5.4
  path_provider: ^2.1.5
  flutter_pdfview: ^1.4.0
  cached_network_image: ^4.0.4

  # UI
  animations: ^3.0.0
  pinput: ^7.0.0

  # Utilitas
  intl: ^0.20.2
  crypto: ^3.0.6
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  google_mlkit_text_recognition: ^0.17.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  audioplayers: ^6.8.1
  printing: ^5.15.1
  mobile_scanner: ^7.4.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_native_splash:
  # Splash native sengaja polos: logo MATRIX v2 dianimasikan Flutter
  # (lib/features/splash/matrix_splash.dart) supaya tidak tampil dua kali.
  color: "#F4F6F4"
  color_dark: "#0D1210"
  android: true
  ios: true
  android_12:
    color: "#F4F6F4"
    color_dark: "#0D1210"
    image: assets/branding/splash_blank.png
    image_dark: assets/branding/splash_blank.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/matrix_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/matrix_icon_fg.png"
  adaptive_icon_monochrome: "assets/branding/matrix_icon_mono.png"
  remove_alpha_ios: true
