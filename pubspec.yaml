name: matrix
description: "SiLAKES MATRIX - Manajemen Absensi Terintegrasi dan Remunerasi Insentif eXpert"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP Client & API
  dio: ^5.4.0
  json_annotation: ^4.8.1
  pretty_dio_logger: ^1.3.1

  # Local Storage & Security
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Face Detection & ML
  google_mlkit_face_detection: ^0.10.0
  camera: ^0.11.0+1
  image_picker: ^1.0.7
  file_picker: ^10.3.8

  # Maps & Location
  flutter_map: ^6.1.0
  google_maps_flutter: ^2.9.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: ^2.1.1

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  animations: ^2.0.11
  flutter_slidable: ^3.0.1

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  device_info_plus: ^9.1.1
  package_info_plus: ^9.0.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.4
  table_calendar: ^3.0.9

  # Biometric Authentication
  local_auth: ^2.1.8

  # PDF Viewer
  flutter_pdfview: ^1.3.2
  photo_view: ^0.14.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6

  # Image Processing
  image: ^4.1.7

  # Pin Code Input & Crypto
  pinput: ^5.0.0
  crypto: ^3.0.7

  # Text-to-Speech
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700

flutter_native_splash:
  color: "#FFFFFF"
  image: MATRIX-LOGO-292x292.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: MATRIX-LOGO-292x292.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "MATRIX-LOGO-292x292.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "MATRIX-LOGO-292x292.png"
  remove_alpha_ios: true
